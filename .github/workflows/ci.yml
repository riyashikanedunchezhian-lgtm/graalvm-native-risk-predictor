name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # No Gradle wrapper is checked into this repo yet (see CONTRIBUTING.md --
      # run `gradle wrapper --gradle-version 8.7` locally and commit the result,
      # then switch this step to `./gradlew` and remove gradle-version below).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build and unit test
        run: gradle build test --stacktrace

      - name: Functional test (Gradle plugin)
        run: gradle :native-risk-gradle-plugin:functionalTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
