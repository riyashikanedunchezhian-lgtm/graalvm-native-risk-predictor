name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle build --stacktrace

      # Publishing to the Gradle Plugin Portal requires PLUGIN_PORTAL_KEY /
      # PLUGIN_PORTAL_SECRET repo secrets to be configured before this step
      # will work -- left as a placeholder until the project is ready to publish.
      - name: Publish plugin
        run: echo "Configure ./gradlew publishPlugins with Plugin Portal credentials before enabling this step."
